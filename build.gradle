buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.baseline-error-prone:gradle-baseline-error-prone:0.25.0'
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.82.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.30.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.36.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.19.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.96.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.31.0'
        classpath 'gradle.plugin.com.github.jengelman.gradle.plugins:shadow:7.0.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:7.7.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:5.0.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.10.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.18.0'
        classpath 'me.champeau.jmh:jmh-gradle-plugin:0.7.3'
        classpath 'com.palantir.gradle.revapi:gradle-revapi:2.2.0'
    }
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.failure-reports'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.jdks'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.baseline-error-prone-root'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'

repositories {
    mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
}

allprojects {
    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.jakarta-package-alignment'
    version System.env.CIRCLE_TAG ?: gitVersion()
    group 'com.palantir.tracing'
}

subprojects {
    apply plugin: 'java-library'

    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }

    tasks.check.dependsOn(javadoc)

    tasks.withType(JavaCompile) {
        options.compilerArgs += ['-Werror']
    }

    plugins.withId('com.palantir.baseline-error-prone', {
        dependencies {
            compileOnly 'org.jspecify:jspecify'
            annotationProcessor 'com.uber.nullaway:nullaway'
        }

        tasks.withType(JavaCompile) {
            options.errorprone.errorproneArgs.add '-XepOpt:NullAway:AnnotatedPackages=com.palantir'
        }
    })

    dependencies {
        modules {
            module('org.glassfish.hk2.external:javax.inject') {
                replacedBy("javax.inject:javax.inject", "javax version is preferred")
            }
            module('jakarta.ws.rs:jakarta.ws.rs-api') {
                replacedBy("javax.ws.rs:javax.ws.rs-api", "javax version is preferred (for now, until jakarta packages are prevalent)")
            }
            module('org.jboss.spec.javax.annotation:jboss-annotations-api_1.3_spec') {
                replacedBy("javax.annotation:javax.annotation-api", "javax version is preferred")
            }
        }
    }
}

javaVersions {
    javaCompiler = 25
    libraryTarget = 17
    runtime = 25
}

jdks {
    daemonTarget = 21
}
